# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
# Deploys an OpenAI-compatible Chat Completions AI Gateway proxy without consumer authentication.
name: llm-gateway-completions-no-auth
displayName: Completions API No Auth
type: template
description: API template for REST-AI-Completions
gateway: apigee
schemaVersion: 1.0.0
features:
  - ../features/ai-endpoint-completions.yaml
  - ../features/auth-apikey-verify.yaml
  - ../features/ai-target-googlecloud.yaml
  - ../features/ai-model-preprocess.yaml
  - ../features/ai-token-quota.yaml
  - ../features/ai-security-anonymization-sdp.yaml
  - ../features/ai-security-modelarmor.yaml
  - ../features/ai-semantic-cache.yaml
  - ../features/ai-model-failover.yaml
  - ../features/ai-model-postprocess.yaml
parameters:
  - name: CompletionsBasePath
    default: /v1/chat/completions
  - name: GoogleCloudProject
    default: "{organization.name}"
  - name: GoogleCloudRegion
    default: "{system.region.name}"
  - name: SimpleModel
    default: google/gemini-3.5-flash-lite
  - name: MediumModel
    default: google/gemini-3.8-flash
  - name: ComplexModel
    default: google/gemini-3.8-flash
  - name: ThinkingModel
    default: anthropic/claude-opus-5
  - name: ModelRouting
    default: "'google/*'=googlecloud-oai,'zai-org/*'=googlecloud-oai,'anthropic/*'=googlecloud"
  - name: ModelMapping
    default: "gemini-flash-latest=gemini-3.7-flash,gemini-2.5-flash=gemini-3.7-flash"
  - name: EMBEDDINGS_LOCATION
    default: europe-west1
  - name: EMBEDDINGS_MODEL
    default: text-embedding-004
  - name: VECTOR_INDEX_ENDPOINT_SUBDOMAIN
    default: "745623412"
  - name: PROJECT_NUMBER
    default: "1052672297239"
  - name: VECTOR_INDEX_ENDPOINT_ID
    default: "575849423838380032"
  - name: VECTOR_INDEX_ID
    default: "9008910094833811456"
  - name: DEPLOYED_INDEX_ID
    default: "semantic_cache"
  - name: THRESHOLD
    default: "0.95"
  - name: TTL_SECONDS
    default: "60"
endpoints:
  - name: completions
    basePath: "{CompletionsBasePath}"
    routes:
      - name: route-googlecloud
        target: googlecloud
        condition: target.route = "googlecloud"
      - name: route-googlecloud-oai
        target: googlecloud-oai
        condition: target.route = "googlecloud-oai"
      - name: route-openai
        target: openai
        condition: target.route = "openai"
      - name: route-anthropic
        target: anthropic
        condition: target.route = "anthropic"
      - name: default
        target: googlecloud
targets:
  - name: anthropic
    url: https://api.anthropic.com
  - name: googlecloud-oai
    url: https://aiplatform.googleapis.com/v1/projects/{GoogleCloudProject}/locations/{GoogleCloudRegion}/endpoints/openapi/chat/completions
  - name: googlecloud
    url: https://aiplatform.googleapis.com/v1/projects/{GoogleCloudProject}/locations/{GoogleCloudRegion}/publishers/{ai.provider}/models/{ai.model}:{ai.method}
  - name: openai
    url: https://api.openai.com
