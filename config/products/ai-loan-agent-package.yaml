name: ai-loan-agent-package
displayName: AI Loan Agent Package
type: product
gateway: apigee
schemaVersion: 1.0.0
description: Package for AI Loan Agent MCP and LLM model access.
access: public
approvalType: auto
environments:
  - dev
quota: "1000"
quotaInterval: "1"
quotaTimeUnit: minute
proxies:
  - llm-gateway-completions-auth-ma-sdp
  - mcp-gateway-loan-product
llmOperations:
  - apiSource: llm-gateway-completions-auth-ma-sdp
    operations:
      - name: /
        methods:
          - POST
        model: gemini-3.8-flash
    llmTokenQuota:
      limit: "10000"
      interval: "1"
      timeUnit: minute
  - apiSource: llm-gateway-completions-auth-ma-sdp
    operations:
      - name: /
        methods:
          - POST
        model: gemini-3.5-flash-lite
    llmTokenQuota: {}
  - apiSource: llm-gateway-completions-auth-ma-sdp
    operations:
      - name: /
        methods:
          - POST
        model: claude-sonnet-5
  - apiSource: llm-gateway-completions-auth-ma-sdp
    operations:
      - name: /
        methods:
          - POST
        model: claude-opus-5
    llmTokenQuota:
      limit: "10000"
      interval: "1"
      timeUnit: hour
payloadOperations:
  - apiSource: mcp-gateway-loan-product
    protocol: MCP
    operations:
      - name: tools/list
  - apiSource: mcp-gateway-loan-product
    protocol: MCP
    operations:
      - name: tools/call/calculate_monthly_installment
    quota:
      limit: "30"
      interval: "1"
      timeUnit: minute
graphqlOperations: []
grpcOperations: []
