name: ai-premium-package
displayName: AI Premium Package
type: product
gateway: apigee
schemaVersion: 1.0.0
description: Premium tier for MCP & LLM Model access.
access: public
approvalType: auto
environments:
  - dev
proxies:
  - llm-gateway-completions-auth-ma-sdp
  - llm-gateway-completions-auth-ma-sdp-semantic
  - MCP-CustomerService
llmOperations:
  - apiSource: llm-gateway-completions-auth-ma-sdp
    operations:
      - name: /
        methods:
          - POST
        model: gemini-3.8-flash
    llmTokenQuota:
      limit: "10000"
      interval: "1"
      timeUnit: minute
  - apiSource: llm-gateway-completions-auth-ma-sdp
    operations:
      - name: /
        methods:
          - POST
        model: gemini-3.5-flash-lite
    llmTokenQuota: {}
  - apiSource: llm-gateway-completions-auth-ma-sdp
    operations:
      - name: /
        methods:
          - POST
        model: claude-sonnet-5
  - apiSource: llm-gateway-completions-auth-ma-sdp
    operations:
      - name: /
        methods:
          - POST
        model: claude-opus-5
    llmTokenQuota:
      limit: "10000"
      interval: "1"
      timeUnit: hour
  - apiSource: llm-gateway-completions-auth-ma-sdp-semantic
    operations:
      - name: /
        methods:
          - POST
        model: gemini-3.5-flash-lite
    llmTokenQuota: {}
      

payloadOperations:
  - apiSource: MCP-CustomerService
    protocol: MCP
    operations:
      - name: tools/list
  - apiSource: MCP-CustomerService
    protocol: MCP
    operations:
      - name: tools/call/customers_list
    quota:
      limit: "30"
      interval: "1"
      timeUnit: minute
graphqlOperations: []
grpcOperations: []
