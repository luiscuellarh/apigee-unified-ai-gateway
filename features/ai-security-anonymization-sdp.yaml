# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
name: security-anonymization-sdp
displayName: Sensitive Data Protection PII Masking
type: feature
description: Anonymizes sensitive PII in user input using Google Cloud Sensitive Data Protection (SDP) API.
documentation: "https://gcp-samples.github.io/apigee-template-repository?file=features%2Fsecurity-anonymization-sdp.yaml"
gateway: apigee
schemaVersion: 1.0.0
categories:
  - security
  - ai
parameters:
  - name: GoogleCloudProject
    default: "{organization.name}"
  - name: GoogleCloudRegion
    default: "{system.region.name}"
  - name: SdpDeidentifyTemplateName
    default: bbva-energy-sdp-template-deidentification
  - name: SdpDeidentifyTemplate
    default: "projects/{GoogleCloudProject}/locations/{GoogleCloudRegion}/deidentifyTemplates/{SdpDeidentifyTemplateName}"
  - name: SdpInspectTemplateName
    default: bbva-energy-sdp-template-inspection
  - name: SdpInspectTemplate
    default: "projects/{GoogleCloudProject}/locations/{GoogleCloudRegion}/inspectTemplates/{SdpInspectTemplateName}"
defaultEndpoint:
  name: default
  basePath: /security-sdp-mask
  routes:
    - name: default
      target: default
  flows:
    - name: PreFlow
      mode: Request
      steps:
        - name: SC-SensitiveDataProtection
        - name: JS-SetAnonymizedInput
  faultRules: []
defaultTarget:
  name: default
  url: https://aiplatform.googleapis.com
  flows: []
  faultRules: []
  httpTargetConnection:
    Properties: {}
    URL: https://aiplatform.googleapis.com
endpoints: []
targets: []
policies:
  - name: SC-SensitiveDataProtection
    type: ServiceCallout
    content:
      ServiceCallout:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: SC-SensitiveDataProtection
        DisplayName: SC-SensitiveDataProtection
        Properties: {}
        Request:
          metadata:
            clearPayload: "true"
            variable: sdpRequest
          IgnoreUnresolvedVariables: "false"
          Set:
            Verb: POST
            Headers:
              Header:
                - Name: Content-Type
                  _text: application/json
            Payload:
              metadata:
                contentType: application/json
              _text: |
                {
                  "item": {
                    "value": "{ai.requestPrompt}"
                  },
                  "deidentifyTemplateName": "{SdpDeidentifyTemplate}",
                  "inspectTemplateName": "{SdpInspectTemplate}"
                }
        Response: sdpResponse
        HTTPTargetConnection:
          Properties: {}
          URL: "https://dlp.googleapis.com/v2/projects/{GoogleCloudProject}/locations/{GoogleCloudRegion}/content:deidentify"
          Authentication:
            GoogleAccessToken:
              Scopes:
                Scope: https://www.googleapis.com/auth/cloud-platform
  - name: JS-SetAnonymizedInput
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-SetAnonymizedInput
        DisplayName: JS-SetAnonymizedInput
        Properties: {}
        Source: |
          var responseContent = context.getVariable("sdpResponse.content");
          if (responseContent) {
            try {
              var responseObj = (typeof responseContent === "object") ? responseContent : JSON.parse(responseContent);
              var maskedText = null;
              if (responseObj) {
                if (responseObj.item && responseObj.item.value !== undefined) {
                  maskedText = responseObj.item.value;
                } else if (responseObj.text !== undefined) {
                  maskedText = responseObj.text;
                }
              }
              if (maskedText !== null && maskedText !== undefined) {
                context.setVariable("ai.requestPrompt", maskedText);
                context.setVariable("user.input", maskedText);
                context.setVariable("user.inputChanged", "true");
              }
            } catch (e) {
              print("Error parsing SDP response: " + e);
            }
          }
          if (!context.getVariable("user.input")) {
            var fallbackPrompt = context.getVariable("ai.requestPrompt") || "";
            context.setVariable("user.input", fallbackPrompt);
          }
resources: []
