name: ai-security-modelarmor
displayName: ai-security-modelarmor
type: feature
description: ai-security-modelarmor
documentation: "https://gcp-samples.github.io/apigee-template-repository?file=features%2Fai-security-modelarmor.yaml"
gateway: apigee
schemaVersion: 1.0.0
categories: []
parameters:
  - name: GoogleCloudProject
    default: "{organization.name}"
  - name: GoogleCloudRegion
    default: "{system.region.name}"
  - name: ModelArmorTemplateRequestName
    default: bbva-energy-ma-template-input 
  - name: ModelArmorTemplateResponseName
    default: bbva-energy-ma-template-output
  - name: ModelArmorTemplateRequest
    default: "projects/{GoogleCloudProject}/locations/{GoogleCloudRegion}/templates/{ModelArmorTemplateRequestName}"
  - name: ModelArmorTemplateResponse
    default: "projects/{GoogleCloudProject}/locations/{GoogleCloudRegion}/templates/{ModelArmorTemplateResponseName}"
defaultEndpoint:
  name: default
  basePath: /ai-security-modelarmor
  routes:
    - name: default
      target: default
  flows:
    - name: PreFlow
      mode: Request
      steps:
        - name: SUP-SanitizePrompt
    - name: PostFlow
      mode: Response
      steps:
        - name: SMR-SanitizeResponse
  faultRules: []
defaultTarget:
  name: default
  url: https://aiplatform.googleapis.com
  flows: []
  faultRules: []
  httpTargetConnection:
    Properties: {}
    URL: https://aiplatform.googleapis.com
endpoints: []
targets: []
policies:
  - name: SUP-SanitizePrompt
    type: SanitizeUserPrompt
    content:
      SanitizeUserPrompt:
        metadata:
          async: "false"
          continueOnError: "false"
          enabled: "true"
          name: SUP-SanitizePrompt
        IgnoreUnresolvedVariables: "false"
        DisplayName: SUP-SanitizePrompt
        ModelArmor:
          TemplateName: "{ModelArmorTemplateRequest}"
        UserPromptSource: "{ai.requestPrompt}"
  - name: SMR-SanitizeResponse
    type: SanitizeModelResponse
    content:
      SanitizeModelResponse:
        metadata:
          name: SMR-SanitizeResponse
          async: "false"
          continueOnError: "false"
          enabled: "true"
        DisplayName: SMR-SanitizeResponse
        IgnoreUnresolvedVariables: "true"
        ModelArmor:
          TemplateName: "{ModelArmorTemplateResponse}"
        UserPromptSource: "{ai.requestPrompt}"
        LLMResponseSource:
          _text: "{jsonPath('$.choices[-1].message.content',response.content,true)}"
resources: []
tests: []
