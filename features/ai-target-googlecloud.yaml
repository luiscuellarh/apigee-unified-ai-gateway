# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
# Configures Vertex AI target endpoints and attaches Google Cloud OAuth 2.0 access tokens to backend requests.
name: ai-target-googlecloud
displayName: Google Cloud Vertex AI Targets
type: feature
description: Proxy for Google Cloud Model Garden models.
documentation: "https://gcp-samples.github.io/apigee-template-repository?file=features%2Fai-target-googlecloud.yaml"
gateway: apigee
schemaVersion: 1.0.0
categories:
  - llm
  - ai
parameters:
  - name: GoogleCloudProject
    default: "{organization.name}"
  - name: GoogleCloudRegion
    default: global
defaultEndpoint:
  name: default
  routes:
    - name: route-googlecloud
      condition: target.route = "googlecloud"
      target: googlecloud
    - name: route-googlecloud-oai
      condition: target.route = "googlecloud-oai"
      target: googlecloud-oai
    - name: default
      target: googlecloud
endpoints: []
targets:
  - name: googlecloud-oai
    url: https://aiplatform.googleapis.com/v1/projects/{GoogleCloudProject}/locations/{GoogleCloudRegion}/endpoints/openapi/chat/completions
    flows:
      - name: PreFlow
        mode: Request
        steps:
          - name: AM-SetGoogleToken
            condition: request.header.Authorization == null or request.header.Authorization !=| "Bearer ya29."
  - name: googlecloud
    url: https://aiplatform.googleapis.com/v1/projects/{GoogleCloudProject}/locations/{GoogleCloudRegion}/publishers/{ai.provider}/models/{ai.model}:{ai.method}
    flows:
      - name: PreFlow
        mode: Request
        steps:
          - name: AM-SetGoogleToken
            condition: request.header.Authorization == null or request.header.Authorization !=| "Bearer ya29."
policies:
  - name: AM-SetGoogleToken
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: AM-SetGoogleToken
        DisplayName: AM-SetGoogleToken
        Properties: {}
        Set:
          Authentication:
            HeaderName: Authorization
            GoogleAccessToken:
              Scopes:
                Scope: https://www.googleapis.com/auth/cloud-platform
        IgnoreUnresolvedVariables: "true"
        AssignTo:
          metadata:
            createNew: "false"
            transport: http
            type: request
resources: []
tests: []
